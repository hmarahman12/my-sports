<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FIFA WORLD CUP 2026</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

video{
    width:100%;
    max-width:900px;
    background:#000;
}
</style>
</head>
<body>

<video id="video" controls playsinline></video>
<audio id="audio"></audio>

<script>
const VIDEO_URL =
'https://d1g8wgjurz8via.cloudfront.net/bpk-tv/ColorsHD/default/ColorsHD-video=2137600.m3u8';

const AUDIO_URL =
'https://d1g8wgjurz8via.cloudfront.net/bpk-tv/ColorsHD/default/ColorsHD-audio_208482_und=208000.m3u8';

const video = document.getElementById('video');
const audio = document.getElementById('audio');

if (Hls.isSupported()) {

    const videoHls = new Hls({
        lowLatencyMode: true,
        maxBufferLength: 5,
        liveSyncDurationCount: 1
    });

    const audioHls = new Hls({
        lowLatencyMode: true,
        maxBufferLength: 5,
        liveSyncDurationCount: 1
    });

    videoHls.loadSource(VIDEO_URL);
    videoHls.attachMedia(video);

    audioHls.loadSource(AUDIO_URL);
    audioHls.attachMedia(audio);

    function syncAudio() {
        const diff = Math.abs(video.currentTime - audio.currentTime);

        if (diff > 0.3) {
            audio.currentTime = video.currentTime;
        }
    }

    video.addEventListener('play', async () => {
        try {
            audio.currentTime = video.currentTime;
            await audio.play();
        } catch(e) {
            console.log(e);
        }
    });

    video.addEventListener('pause', () => {
        audio.pause();
    });

    video.addEventListener('seeking', () => {
        audio.currentTime = video.currentTime;
    });

    video.addEventListener('ratechange', () => {
        audio.playbackRate = video.playbackRate;
    });

    video.addEventListener('timeupdate', syncAudio);

} else if (video.canPlayType('application/vnd.apple.mpegurl')) {

    video.src = VIDEO_URL;
    audio.src = AUDIO_URL;

}
</script>

</body>
</html>
