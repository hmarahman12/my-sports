<body>
    <div class="delete" style="background: rgb(245, 172, 172); color: red; text-align: center; margin: auto;"></div>
    <div class="container"></div>
    <div class="containerr"></div>

    <script type="module">
    // Import the functions you need from the SDKs you need
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-app.js";
    const firebaseConfig = {
      apiKey: "AIzaSyCbLKuJsZ9du9hHBTUU5gfzN0Jxe7EQiXE",
      authDomain: "live-cricket-47611.firebaseapp.com",
      databaseURL: "https://live-cricket-47611-default-rtdb.firebaseio.com",
      projectId: "live-cricket-47611",
      storageBucket: "live-cricket-47611.firebasestorage.app",
      messagingSenderId: "20357197788",
      appId: "1:20357197788:web:e62f1d7d59b0129446e919",
      measurementId: "G-R0P9EJ1KDJ"
    };
// Initialize Firebase
const app = initializeApp(firebaseConfig);

import {getDatabase, child, get,update, remove, ref, set}from "https://www.gstatic.com/firebasejs/11.5.0/firebase-database.js";

const db = getDatabase();


//upload News
  document.querySelector(".container").innerHTML = `
        <div class="container col-md-4">
          <div class="upload-head">
            <h3>LIVE News</h3>
            <input id="title" type="text" placeholder="News Title" required>
            <input id="title1" type="text" placeholder="Date" required>
            <input id="tvimg" type="text" placeholder="News Link / Thumnail" required>
            <input id="Sourcescode" type="text" placeholder="Description" required>
            <input id="submit" class="submit" type="submit" value="Submit">
            <span class="sc"></span>
          </div>
        </div>`;
      ////////////////////////Submited///////////////////////
      document.querySelector("input#submit").addEventListener ('click', function(){
        // const titleE = document.querySelector("input#titleE").value;
        const title = document.querySelector("input#title").value;
        const title_1 = document.querySelector("input#title1").value;
        const tvimg = document.querySelector("input#tvimg").value;
        const Sourcescode = document.querySelector("input#Sourcescode").value;


        if(!title == "" || !title_1 == "" || !Sourcescode == ""){
          setTimeout(() => {
            document.querySelector(".sc").innerHTML = "Sucssfully";
            document.querySelector("#tvimg").value = "";
            document.querySelector("#Sourcescode").value = "";
            document.querySelector("#title").value = "";
            document.querySelector("#title1").value = "";

            const title1 = "https://my-sports.live/News/?" + Date.now()   // important for sorting (latest first);
            const addminTitle = title1.replace(/[/]/g, '');
            const addminTitle1 = addminTitle.replace(/\./g, "");
            
            set(ref(db, "News/" + addminTitle1),{
              NewsTitle : title,
              uid: Date.now(),   // important for sorting (latest first)
              NewsDate : title_1,
              Newslink : tvimg,
              NewsDescription : Sourcescode
            })

          }, 2000);
          setTimeout(() => {
            document.querySelector(".sc").innerHTML = "";
          }, 3000);
        }else{
          document.querySelector('.dn').innerHTML = "!Plase All Input flap";
        }
      });
  


function RetData() {
  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  
  const dbRef = ref(db);
    get(child(dbRef, 'News/'))
      .then((snapshot) => {
        if (snapshot.exists()) {
          const allValues = snapshot.val();
          // Example: Loop through all posts and print titles
          document.querySelector(".containerr").innerHTML = '';
          for (const id in allValues) {
            const post = allValues[id];
            document.querySelector(".containerr").innerHTML += `<div class="items">
              <div class="items-title">${post.NewsTitle}</div>
              <div class="items-title">${post.NewsDate}</div>
              <iframe src="${post.Newslink}" allowfullscreen></iframe>
              <i id="delette" class="fas fa-trash"></i>
            </div>`;
            let dltBTN = document.querySelectorAll("i#delette");
            dltBTN.forEach((dltBTNs)=>{

              dltBTNs.addEventListener('click', function(){
                // ✅ Function to fetch and log all post titles
                
                DeletePost(post.NewsTitle)

                // ✅ Function to delete a specific post by ID
                  function DeletePost(postId) {
                    const postRef = ref(db, 'News/' + postId);
                    remove(postRef)
                      .then(() => {
                        document.querySelector(".delete").innerHTML = `Post ${postId} deleted successfully.`;
                        setTimeout(() => {
                            document.querySelector(".delete").innerHTML = "";
                        }, 2000);
                      })
                      .catch((error) => {
                        console.error("Error deleting post:", error);
                      });
                  }
              })
            })
          }
        } else {
          document.querySelector(".containerr").innerHTML = 'No Available News';
        }
      })
      .catch((error) => {
        console.error("Error fetching data:", error);
      });
  }RetData();
  
    </script>
