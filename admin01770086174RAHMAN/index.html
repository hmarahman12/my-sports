function RetData() {
  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  
  const dbRef = ref(db);
    get(child(dbRef, 'HighlightsMatch/'))
      .then((snapshot) => {
        if (snapshot.exists()) {
          const allValues = snapshot.val();
          // Example: Loop through all posts and print titles
          document.querySelector(".containerr").innerHTML = '';
          for (const id in allValues) {
            const post = allValues[id];
            document.querySelector(".containerr").innerHTML += `<div class="items">
              <a href=""><img id="backButton" src="https://static.vecteezy.com/system/resources/previews/020/998/055/non_2x/rounded-back-icon-element-free-png.png" alt=""></a>
              <div class="items-title">${post.title}</div>
              <iframe src="${post.fullcode}" allowfullscreen></iframe>
              <i id="delette" class="fas fa-trash"></i>
            </div>`;
            let dltBTN = document.querySelectorAll("i#delette");
            dltBTN.forEach((dltBTNs)=>{

              dltBTNs.addEventListener('click', function(){
                // ✅ Function to fetch and log all post titles
                
                DeletePost(post.title)

                // ✅ Function to delete a specific post by ID
                  function DeletePost(postId) {
                    const postRef = ref(db, 'posts/' + postId);
                    remove(postRef)
                      .then(() => {
                        console.log(`Post ${postId} deleted successfully.`);
                      })
                      .catch((error) => {
                        console.error("Error deleting post:", error);
                      });
                  }
              })
            })
          }
        } else {
          console.log("No data available");

        console.error("Error fetching data:", error);

  function updateChart() {
      const chart = document.getElementById('chart');
      chart.innerHTML = ''; // Clear previous chart
      const dbRef = ref(db);

      get(child(dbRef, 'RaningMonth/')).then(snapshot => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          const days = Object.keys(data)
            .sort() // Chronological order

          const activeUsers = days.map(date => {
            return {
              date: date,
              users: Object.keys(data[date] || {}).length
            };
          });

          const maxUsers = Math.max(...activeUsers.map(d => d.users)) || 1;

          activeUsers.forEach(day => {
            const barContainer = document.createElement('div');
            barContainer.className = 'bar-container';

            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = `${(day.users / maxUsers) * 100}%`;
            bar.textContent = day.users;

            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = day.date; // full date

            barContainer.appendChild(bar);
            barContainer.appendChild(label);
            chart.appendChild(barContainer);
          });

        } else {
          console.log("No data found in RaningMonth/");
        }
      }).catch(error => {
        console.error("Error reading Firebase data:", error);
      });
    }

    // Auto update chart every 5 seconds
    setInterval(updateChart, 10000);
    updateChart(); // Initial load

    </script>
